; Limits for cover uploads.
;
; A photo from a phone is quickly four or five megabytes. PHP's default is two
; in many places, and the file is then refused before any code of this
; application gets to see it.
;
; all-inkl runs PHP over FastCGI, where .user.ini applies (php_value in the
; .htaccess only has an effect when PHP runs as an Apache module). Changes take
; a few minutes to take hold.

upload_max_filesize = 12M
post_max_size = 16M

; Errors belong in the log, not on the page.
display_errors = Off
log_errors = On

; log_errors alone is not enough on this host. Without a path, PHP's
; error_log() writes nowhere at all and every diagnosis is discarded - which
; is worth knowing before spending an evening looking for a file that was
; never created. all-inkl's own instructions say to set it here:
;
;   error_log = /www/htdocs/<KAS login>/<folder>/errorlog.txt
;
; The folder has to exist. It is left commented out because the path contains
; an account name that no two installations share.
;
; The application does not depend on it: it writes its own boot-error.log
; beside config.php, above the document root, for exactly this reason. This
; line adds the errors that are PHP's rather than the application's - a
; warning from an extension, a limit being hit.
