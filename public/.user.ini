; Grenzen für Cover-Uploads.
;
; Ein Foto vom Handy ist schnell vier oder fünf Megabyte. PHPs Voreinstellung
; liegt vielerorts bei zwei, und die Datei wird dann abgewiesen, bevor
; irgendein Code dieser Anwendung sie zu sehen bekommt.
;
; all-inkl fährt PHP über FastCGI, dort greift .user.ini (php_value in der
; .htaccess wirkt nur, wenn PHP als Apache-Modul läuft). Änderungen brauchen
; einige Minuten, bis sie greifen.

upload_max_filesize = 12M
post_max_size = 16M

; Fehler gehören ins Log, nicht auf die Seite.
display_errors = Off
log_errors = On
