name: Deploy

# Does NOT run automatically on commits, only by hand:
# GitHub → "Actions" tab → "Deploy" → "Run workflow".
#
# The application code deliberately sits ABOVE the document root, so what gets
# uploaded is the repository root into the project folder - not public/ into
# the document root. The subdomain's document root then has to point at the
# public/ subfolder of that.
#
#   /regal/            <- server_dir, everything is uploaded here
#     app/  migrations/  schema.sql
#     config.php        <- exists only on the server, never touched
#     public/           <- the subdomain's document root
#
# If the document root points at /regal/ instead of /regal/public/, the whole
# source is readable over HTTP. That is the one setting that has to be right.

on:
  workflow_dispatch:
    inputs:
      server_dir:
        description: "Project folder on the server, relative to where FTP logs in - NOT the document root, the level above it"
        required: true
        # No default on purpose. A filled-in one is a wrong answer that only
        # has to be clicked past: the right value depends on the account, and
        # deploying to a folder nobody meant scatters an application across
        # somebody's web space quietly and successfully.

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      # Otherwise a typo in a PHP file takes the site down on the server, and
      # the only way back is a second deploy.
      - name: Check the syntax of every PHP file
        run: |
          set -e
          find app bin public tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          echo "Syntax is fine."

      - name: Tests
        run: php tests/run.php

      - name: Check the target folder
        run: |
          case "${{ github.event.inputs.server_dir }}" in
            */public/|*/public)
              echo "::error::server_dir points at the document root."
              echo "::error::The level ABOVE it is expected, e.g. /regal/ rather than /regal/public/."
              exit 1 ;;
          esac
          echo "Target folder: ${{ github.event.inputs.server_dir }}"

      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # The whole FTP dialogue in the run log.
          #
          # The first attempt died with ECONNRESET on the data socket: the
          # login worked and the state file was checked, and then the very
          # first directory listing - the first thing that opens a second,
          # encrypted connection - was reset. Without the dialogue that is
          # three plausible causes and no way to choose between them; with
          # it, the PASV reply says which.
          #
          # It prints no credentials. Turn it back to standard once the
          # deployment runs.
          log-level: verbose
          local-dir: ./
          server-dir: ${{ github.event.inputs.server_dir }}
          # No dangerous-clean-slate: nothing is deleted.
          #
          # Excluded is everything that is created on the server or has no
          # business being there. public/covers/ is top of the list: those are
          # the cover photographs, which exist only there and which no deploy
          # may overwrite. public/assets/brand/ is the same case for the site's
          # own logo and icons: they are not in the repository, and a deploy
          # that carried them would put one installation's brand on another.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.claude/**
            **/.DS_Store
            **/config.php
            **/config.php.bak
            **/storage/**
            **/public/covers/**
            **/public/assets/brand/**
            **/tests/**
            **/router.dev.php
            **/dev.sh
            **/config.dev.php
            **/*.csv
            **/*.md
