name: Deploy

# Does NOT run automatically on commits, only by hand:
# GitHub → "Actions" tab → "Deploy" → "Run workflow".
#
# The application code deliberately sits ABOVE the document root, so what gets
# uploaded is the repository root into the project folder - not public/ into
# the document root. The subdomain's document root then has to point at the
# public/ subfolder of that.
#
#   /regal/            <- server_dir, everything is uploaded here
#     app/  migrations/  schema.sql
#     config.php        <- exists only on the server, never touched
#     public/           <- the subdomain's document root
#
# If the document root points at /regal/ instead of /regal/public/, the whole
# source is readable over HTTP. That is the one setting that has to be right.

on:
  workflow_dispatch:
    inputs:
      server_dir:
        description: "Project folder on the server, relative to where FTP logs in - NOT the document root, the level above it"
        required: true
        # No default on purpose. A filled-in one is a wrong answer that only
        # has to be clicked past: the right value depends on the account, and
        # deploying to a folder nobody meant scatters an application across
        # somebody's web space quietly and successfully.

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      # Otherwise a typo in a PHP file takes the site down on the server, and
      # the only way back is a second deploy.
      - name: Check the syntax of every PHP file
        run: |
          set -e
          find app bin public tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          echo "Syntax is fine."

      - name: Tests
        run: php tests/run.php

      - name: Check the target folder
        run: |
          case "${{ github.event.inputs.server_dir }}" in
            */public/|*/public)
              echo "::error::server_dir points at the document root."
              echo "::error::The level ABOVE it is expected, e.g. /regal/ rather than /regal/public/."
              exit 1 ;;
          esac
          echo "Target folder: ${{ github.event.inputs.server_dir }}"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # lftp rather than an FTP action, because the action could not open a
      # data connection here at all. The server wants the data channel to
      # resume the control channel's TLS session - the usual way an FTPS
      # server checks the two belong together - and the library behind the
      # action does not do that. lftp does. That is the whole reason.
      #
      # ssl:verify-certificate is off: the traffic stays encrypted, but
      # nothing proves who is on the other end, because the hoster's FTP
      # certificate does not match the name it is reached under. Worth
      # writing down rather than pretending about.
      #
      # The password goes through the environment, not the command line, so
      # it is not in the process list of a shared runner.
      #
      # The excludes are not the ones in .gitignore. lftp mirrors the file
      # system, so an ignored file that happens to sit in the working tree
      # goes up like any other - on a runner that is a fresh clone and the
      # question never arises, but run from a machine it does. That is how
      # public/assets/brand.zip, taken out of the repository for sitting in
      # the document root, would have arrived in the document root.
      #
      # NOTE the missing --delete, which is deliberate and load-bearing. A
      # mirror that removes whatever it does not have locally would take the
      # covers, the configuration and the brand with it - all of which exist
      # only on the server, and all of which are excluded from this upload
      # precisely because they have to survive it. Deleting is what a static
      # site wants and the opposite of what this one does. Stale files after
      # a rename are the price, and a cheap one.
      - name: Upload over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          TARGET: ${{ github.event.inputs.server_dir }}
        run: |
          lftp -c "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 20;
            open -u '$FTP_USERNAME' --env-password '$FTP_SERVER';
            mirror --reverse --verbose --parallel=1 \
              --exclude '(^|/)\.git' \
              --exclude '(^|/)\.github/' \
              --exclude '(^|/)\.claude/' \
              --exclude '(^|/)\.DS_Store$' \
              --exclude '(^|/)config\.php$' \
              --exclude '(^|/)config\.php\.bak$' \
              --exclude '(^|/)config\.dev\.php$' \
              --exclude '(^|/)storage/' \
              --exclude '(^|/)public/covers/' \
              --exclude '(^|/)public/assets/brand' \
              --exclude '\.zip$' \
              --exclude '(^|/)tests/' \
              --exclude '(^|/)router\.dev\.php$' \
              --exclude '(^|/)dev\.sh$' \
              --exclude '\.csv$' \
              --exclude '\.md$' \
              ./ '$TARGET';
          "
