name: Tests

# The same two checks the deploy runs, but on every push and every pull
# request rather than only at the moment of deploying.
#
# They already existed. They just sat inside a workflow_dispatch job, so they
# ran once you had decided to put something on the server - which is late to
# find out, and never at all for a branch you have not deployed. Since the
# repository went public there is a second reason: somebody else's pull
# request gets checked without anyone having to fetch it first.
#
# The steps stay in the deploy too. This is the check that tells you early;
# that one is the gate that will not upload a broken file to the web space,
# and a gate you can reach without passing this one is not a gate.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      # A typo in a PHP file takes the site down on the server, and the only
      # way back is a second deploy.
      - name: Check the syntax of every PHP file
        run: |
          set -e
          find app bin public tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          echo "Syntax is fine."

      - name: Tests
        run: php tests/run.php

  # The same suite against the database production actually runs on.
  #
  # Every test used to be SQLite, and production is MySQL - which is where
  # the faults that cost the most came from: a DECIMAL that comes back as a
  # string, a keyword one engine has and the other does not. With
  # REGAL_TEST_MYSQL_HOST set, tests/support/TestDatabase.php hands each test
  # a real database, loaded from schema.sql as it stands.
  #
  # Both engines, because a hoster offers one or the other and an
  # installation elsewhere may be on either.
  database:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["mysql:8.0", "mariadb:10.11"]
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: test
          MARIADB_ROOT_PASSWORD: test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest || healthcheck.sh --connect"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql
          coverage: none

      - name: Tests against ${{ matrix.image }}
        env:
          REGAL_TEST_MYSQL_HOST: 127.0.0.1
          REGAL_TEST_MYSQL_USER: root
          REGAL_TEST_MYSQL_PASS: test
        run: php tests/run.php
